# Log4j Setting file
log4j.rootLogger=INFO, console, logfile

# Console log
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%5p | %d | %F | %L | %m%n

# Daily file log
log4j.appender.logfile=org.apache.log4j.DailyRollingFileAppender
log4j.appender.logfile.File=${EEG_BASE}/log/HttpWebServer/HttpWebServer.log
log4j.appender.logfile.DatePattern='.'yyyy-MM-dd
log4j.appender.logfile.layout=org.apache.log4j.PatternLayout
log4j.appender.logfile.layout.ConversionPattern=%5p | %d | %F | %L | %m%n

# elasticsearch
log4j.appender.search=org.apache.log4j.net.SocketAppender
log4j.appender.search.remoteHost=12.57.238.90
log4j.appender.search.port=31000
log4j.appender.search.layout.ConversionPattern=%5p | %d | %F | %L | %m%n
